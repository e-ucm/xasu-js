name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci runs the prepare script, which is the build: dist/ is not committed
      - name: Install dependencies
        run: npm ci

      # the tests import the tracker from dist/, so this also checks that a plain install
      # produced it rather than relying on a stale copy
      - name: Build
        run: npm run build

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx mocha

      # the API reference is generated from the JSDoc, so a stale page means the docs drifted
      - name: Check the API reference is up to date
        run: |
          npm run docs:reference
          git diff --exit-code -- docs/reference
